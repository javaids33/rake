image:
  repository: rustlake/rustlake
  tag: latest
  pullPolicy: IfNotPresent

coordinator:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

worker:
  replicas: 3
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  spillVolume:
    enabled: true
    sizeLimit: "10Gi"

flight:
  enabled: true
  port: 50051
  maxMessageSize: 67108864  # 64 MB

cluster:
  heartbeatIntervalSecs: 10
  heartbeatTimeoutSecs: 30
  maxPartitionsPerWorker: 4
  shuffleBufferSize: 134217728  # 128 MB
  discovery: kubernetes

k8s:
  serviceName: "rustlake-worker-headless"
  portName: "flight"
  pollIntervalSecs: 30

service:
  type: ClusterIP
  httpPort: 3000
  flightPort: 50051

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rustlake.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
