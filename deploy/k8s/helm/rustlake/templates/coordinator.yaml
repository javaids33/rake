apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-coordinator
  labels:
    app.kubernetes.io/name: rustlake
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rustlake
      app.kubernetes.io/component: coordinator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustlake
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Release.Name }}-coordinator
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rustlake-api"]
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: flight
              containerPort: {{ .Values.flight.port }}
          env:
            - name: RUSTLAKE_CLUSTER__NODE_ROLE
              value: "coordinator"
            - name: RUSTLAKE_CLUSTER__DISCOVERY
              value: {{ .Values.cluster.discovery | quote }}
            - name: RUSTLAKE_FLIGHT__ENABLED
              value: {{ .Values.flight.enabled | quote }}
            - name: RUSTLAKE_FLIGHT__HOST
              value: "0.0.0.0"
            - name: RUSTLAKE_FLIGHT__PORT
              value: {{ .Values.flight.port | quote }}
            - name: RUSTLAKE_FLIGHT__MAX_MESSAGE_SIZE
              value: {{ .Values.flight.maxMessageSize | quote }}
            - name: RUSTLAKE_CLUSTER__HEARTBEAT_INTERVAL_SECS
              value: {{ .Values.cluster.heartbeatIntervalSecs | quote }}
            - name: RUSTLAKE_CLUSTER__HEARTBEAT_TIMEOUT_SECS
              value: {{ .Values.cluster.heartbeatTimeoutSecs | quote }}
            - name: RUSTLAKE_K8S__NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUSTLAKE_K8S__SERVICE_NAME
              value: {{ .Values.k8s.serviceName | quote }}
            - name: RUSTLAKE_K8S__PORT_NAME
              value: {{ .Values.k8s.portName | quote }}
            - name: RUSTLAKE_K8S__POLL_INTERVAL_SECS
              value: {{ .Values.k8s.pollIntervalSecs | quote }}
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-coordinator
  labels:
    app.kubernetes.io/name: rustlake
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: rustlake
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: flight
      port: {{ .Values.service.flightPort }}
      targetPort: flight
