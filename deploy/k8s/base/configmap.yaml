apiVersion: v1
kind: ConfigMap
metadata:
  name: rustlake-config
  namespace: rustlake
  labels:
    app.kubernetes.io/name: rustlake
data:
  config.toml: |
    [flight]
    enabled = true
    host = "0.0.0.0"
    port = 50051
    max_message_size = 67108864  # 64 MB

    [cluster]
    heartbeat_interval_secs = 10
    heartbeat_timeout_secs = 30
    max_partitions_per_worker = 4
    shuffle_buffer_size = 134217728  # 128 MB

    [k8s]
    namespace = "rustlake"
    service_name = "rustlake-worker-headless"
    port_name = "flight"
    poll_interval_secs = 30
