# ServiceAccount for the coordinator — needs endpoint read for K8s discovery.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustlake-coordinator
  namespace: rustlake
  labels:
    app.kubernetes.io/name: rustlake
    app.kubernetes.io/component: coordinator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustlake-worker
  namespace: rustlake
  labels:
    app.kubernetes.io/name: rustlake
    app.kubernetes.io/component: worker
---
# The coordinator needs to list endpoints for DNS-based worker discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustlake-coordinator
  namespace: rustlake
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustlake-coordinator
  namespace: rustlake
subjects:
  - kind: ServiceAccount
    name: rustlake-coordinator
    namespace: rustlake
roleRef:
  kind: Role
  name: rustlake-coordinator
  apiGroup: rbac.authorization.k8s.io
