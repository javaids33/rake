# ============================================================================
# RustLake Docker Compose — All Supported Data Sources
# ============================================================================
#
# Quick start (core only — Postgres, MySQL, MongoDB, MinIO):
#   docker compose up -d
#
# Start everything:
#   docker compose --profile streaming --profile analytics --profile search up -d
#
# Start specific profiles:
#   docker compose --profile streaming up -d    # Kafka, RabbitMQ, NATS, MQTT
#   docker compose --profile analytics up -d    # ClickHouse, Cassandra
#   docker compose --profile search up -d       # Elasticsearch, Redis
#
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # CORE DATABASES (always started)
  # --------------------------------------------------------------------------

  # Postgres — primary relational store, seeded with demo data
  postgres:
    image: postgres:16-alpine
    container_name: rustlake-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rustlake_demo
      POSTGRES_USER: rustlake
      POSTGRES_PASSWORD: rustlake
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/tpch-init.sql:/docker-entrypoint-initdb.d/02-tpch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustlake -d rustlake_demo"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # MySQL — relational store, seeded with demo data subset
  mysql:
    image: mysql:8.0
    container_name: rustlake-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rustlake_demo
      MYSQL_USER: rustlake
      MYSQL_PASSWORD: rustlake
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rustlake", "-prustlake"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # MongoDB — document store with replica set (required for Change Streams CDC)
  mongo:
    image: mongo:7
    container_name: rustlake-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/rs-keyfile"]
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rustlake
      MONGO_INITDB_ROOT_PASSWORD: rustlake
      MONGO_INITDB_DATABASE: rustlake_demo
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
      - ./docker/mongo/rs-keyfile:/etc/mongo/rs-keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "rustlake", "-p", "rustlake", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # OBJECT STORAGE (always started)
  # --------------------------------------------------------------------------

  # MinIO — S3-compatible object storage for Iceberg tables
  minio:
    image: minio/minio:latest
    container_name: rustlake-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rustlake
      MINIO_ROOT_PASSWORD: rustlake123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # Creates the default Iceberg warehouse bucket on first start
  minio-init:
    image: minio/mc:latest
    container_name: rustlake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustlake http://minio:9000 rustlake rustlake123 &&
      mc mb --ignore-existing rustlake/rustlake-warehouse &&
      mc mb --ignore-existing rustlake/rustlake-data &&
      echo 'Buckets created successfully'
      "
    profiles:
      - init

  # --------------------------------------------------------------------------
  # SEARCH & CACHE (profile: search)
  # --------------------------------------------------------------------------

  # Redis — in-memory store, streams, sorted sets, seeded with demo data
  redis:
    image: redis:7-alpine
    container_name: rustlake-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - search

  # Seeds Redis with demo data after startup
  redis-init:
    image: redis:7-alpine
    container_name: rustlake-redis-init
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/redis/init.sh:/init.sh:ro
    entrypoint: ["sh", "-c", "sed 's/localhost/redis/g' /init.sh | sh"]
    profiles:
      - search

  # Elasticsearch — full-text search and log analytics
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: rustlake-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    profiles:
      - search

  # Seeds Elasticsearch with product catalog and log data
  elasticsearch-init:
    image: curlimages/curl:latest
    container_name: rustlake-es-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/elasticsearch/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      - ES_HOST=elasticsearch
    profiles:
      - search

  # --------------------------------------------------------------------------
  # ANALYTICS (profile: analytics)
  # --------------------------------------------------------------------------

  # ClickHouse — column-oriented OLAP database
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: rustlake-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9100:9000"   # Native TCP (remapped to avoid MinIO conflict)
    environment:
      CLICKHOUSE_DB: rustlake_demo
      CLICKHOUSE_USER: rustlake
      CLICKHOUSE_PASSWORD: rustlake
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    profiles:
      - analytics

  # Cassandra — wide-column NoSQL for time-series and IoT
  cassandra:
    image: cassandra:4.1
    container_name: rustlake-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: rustlake
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    profiles:
      - analytics

  # Seeds Cassandra after it's fully up (takes a while)
  cassandra-init:
    image: cassandra:4.1
    container_name: rustlake-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql:ro
      - ./docker/cassandra/init.sh:/init.sh:ro
    entrypoint: ["sh", "-c", "sed 's/cqlsh/cqlsh cassandra/g' /init.sh | sh"]
    profiles:
      - analytics

  # --------------------------------------------------------------------------
  # STREAMING & MESSAGING (profile: streaming)
  # --------------------------------------------------------------------------

  # Zookeeper — required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: rustlake-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # Apache Kafka — distributed event streaming
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rustlake-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # Confluent Schema Registry — Avro/JSON/Protobuf schema management
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: rustlake-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # Creates default Kafka topics for demos
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rustlake-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic events --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic clickstream --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-activity --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic dead-letter --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created'
      "
    profiles:
      - streaming

  # RabbitMQ — AMQP message broker with management UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rustlake-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: rustlake
      RABBITMQ_DEFAULT_PASS: rustlake
      RABBITMQ_DEFAULT_VHOST: rustlake
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # NATS — lightweight cloud-native messaging with JetStream
  nats:
    image: nats:2.10-alpine
    container_name: rustlake-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats-data:/data
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # Mosquitto — MQTT broker for IoT workloads
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rustlake-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9883:9001"   # WebSocket (remapped to avoid conflict)
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    command: >
      sh -c "echo 'listener 1883
      allow_anonymous true
      listener 9001
      protocol websockets' > /mosquitto/config/mosquitto.conf &&
      mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - streaming

  # --------------------------------------------------------------------------
  # RUSTLAKE APPLICATION
  # --------------------------------------------------------------------------

  # RustLake API Server
  rustlake-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rustlake-api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - RUSTLAKE_STORAGE__DATA_DIR=/opt/rustlake/data
      - RUSTLAKE_API__HOST=0.0.0.0
      - RUSTLAKE_API__PORT=3000
      - RUSTLAKE_PG_HOST=postgres
      - RUSTLAKE_PG_PORT=5432
      - RUSTLAKE_PG_DB=rustlake_demo
      - RUSTLAKE_PG_USER=rustlake
      - RUSTLAKE_PG_PASSWORD=rustlake
      - RUSTLAKE_MYSQL_HOST=mysql
      - RUSTLAKE_MYSQL_PORT=3306
      - RUSTLAKE_MYSQL_DB=rustlake_demo
      - RUSTLAKE_MYSQL_USER=rustlake
      - RUSTLAKE_MYSQL_PASSWORD=rustlake
      - RUSTLAKE_MONGO_HOST=mongo
      - RUSTLAKE_MONGO_PORT=27017
      - RUSTLAKE_MONGO_DB=rustlake_demo
      - RUSTLAKE_MONGO_USER=rustlake
      - RUSTLAKE_MONGO_PASSWORD=rustlake
    volumes:
      - rustlake-data:/opt/rustlake/data
      - rustlake-uploads:/opt/rustlake/uploads
      - ./sample-data:/opt/rustlake/sample-data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # RustLake Benchmark Runner
  # Usage: docker compose run rustlake-bench query "SELECT count(*) FROM 'sample-data/sales.csv'"
  rustlake-bench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rustlake-bench
    depends_on:
      rustlake-api:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - RUSTLAKE_STORAGE__DATA_DIR=/opt/rustlake/data
    volumes:
      - rustlake-data:/opt/rustlake/data
      - ./sample-data:/opt/rustlake/sample-data:ro
    entrypoint: ["rustlake"]
    command: ["query", "SELECT 'benchmark-ready' AS status"]
    profiles:
      - bench

volumes:
  # Core
  rustlake-data:
    driver: local
  rustlake-uploads:
    driver: local
  pg-data:
    driver: local
  mysql-data:
    driver: local
  mongo-data:
    driver: local
  minio-data:
    driver: local
  # Search
  redis-data:
    driver: local
  es-data:
    driver: local
  # Analytics
  clickhouse-data:
    driver: local
  cassandra-data:
    driver: local
  # Streaming
  zk-data:
    driver: local
  zk-logs:
    driver: local
  kafka-data:
    driver: local
  rabbitmq-data:
    driver: local
  nats-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
